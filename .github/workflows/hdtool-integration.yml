name: HD Tool integration contract
on:
  push:
    branches: [hdtool, 'sync/**']
  pull_request:
    branches: [hdtool]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python integrations/hdtool/check.py
      - run: python -m unittest tests.test_server_mode tests.test_browser_login -v
      - run: python -m unittest discover -s integrations/hdtool/tests -v
