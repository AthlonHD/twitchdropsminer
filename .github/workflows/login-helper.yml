name: Login helper binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the helper to (e.g. v1.7.4)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-13, name: macos-x64 }
          - { os: macos-14, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller playwright requests
      - run: pyinstaller --onefile --name tdm-login-helper --collect-all playwright scripts/tdm_login_helper.py
      - name: Package
        shell: bash
        run: |
          mkdir out
          cp dist/tdm-login-helper* out/
          ASSET="tdm-login-helper-${TAG#v}-${{ matrix.name }}.tar.gz"
          tar -czf "$ASSET" -C out .
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
      - name: Attach to release
        shell: bash
        run: gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
